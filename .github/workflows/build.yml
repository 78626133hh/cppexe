name: Build EXE

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: sudo apt update && sudo apt install -y mingw-w64

      - name: Compile
        run: x86_64-w64-mingw32-g++ -std=c++17 -O2 -static main.cpp -o dog.exe

      - uses: actions/upload-artifact@v4
        with:
          name: dog-exe
          path: dog.exe
